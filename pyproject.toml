[project]
name = "neurawall"
version = "1.1.0"
description = "NeuraWall — AI-assisted firewall with deterministic enforcement, three-tier inference and human-approved policy."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
authors = [{ name = "NeuraWall" }]
dependencies = [
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "cryptography>=43",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "anthropic>=0.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
neurawall = "neurawall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The console is built into this (gitignored) directory by `npm run build`; ship it
# in both the sdist and the wheel.
artifacts = ["neurawall/services/control_plane/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["neurawall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
# N818: exception names follow the blueprint's vocabulary (PolicyViolation, IntegrityFailure).
ignore = ["S101", "B008", "RUF012", "N818"]

[tool.ruff.lint.pycodestyle]
# The formatter keeps code at 100; long string literals may run to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "E501"]
# Synthetic traffic uses non-cryptographic randomness by design.
"neurawall/modules/flow_collector/generator.py" = ["S311"]
"neurawall/modules/anomaly_engine/engine.py" = ["S311"]
"neurawall/services/control_plane/migrations/**" = ["E501", "I001", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Layer boundaries from docs/ai-firewall-project-layout.md §3.1 — enforced in CI.
[tool.importlinter]
root_package = "neurawall"

[[tool.importlinter.contracts]]
name = "Layered architecture: services > modules > security > core"
type = "layers"
layers = [
    "neurawall.cli",
    "neurawall.services",
    "neurawall.modules",
    "neurawall.security",
    "neurawall.core",
]

[[tool.importlinter.contracts]]
name = "Domain modules are independent of each other"
type = "independence"
modules = [
    "neurawall.modules.anomaly_engine",
    "neurawall.modules.l7_classifier",
    "neurawall.modules.llm_advisor",
    "neurawall.modules.flow_collector",
    "neurawall.modules.datapath",
    "neurawall.modules.policy_engine",
    "neurawall.modules.billing",
    "neurawall.modules.nexora",
    "neurawall.modules.notify",
]

[[tool.importlinter.contracts]]
name = "The LLM advisor can never reach the policy engine or the datapath"
type = "forbidden"
source_modules = ["neurawall.modules.llm_advisor"]
forbidden_modules = ["neurawall.modules.policy_engine", "neurawall.modules.datapath", "neurawall.services"]
