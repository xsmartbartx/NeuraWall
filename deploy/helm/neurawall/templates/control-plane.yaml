apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "neurawall.fullname" . }}-data
  labels: {{- include "neurawall.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.controlPlane.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.controlPlane.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neurawall.fullname" . }}
  labels: {{- include "neurawall.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels: {{- include "neurawall.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control-plane
          image: {{ include "neurawall.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: NEURAWALL_PUBLIC_URL, value: {{ .Values.controlPlane.publicUrl | quote }} }
            - { name: NEURAWALL_POLICY__REQUIRE_FOUR_EYES, value: {{ .Values.controlPlane.requireFourEyes | quote }} }
            - { name: NEURAWALL_DEMO_MODE, value: {{ .Values.controlPlane.demoMode | quote }} }
            - { name: FORWARDED_ALLOW_IPS, value: "*" }
            - name: NEURAWALL_AUTH__SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "neurawall.secretName" . }}, key: secretKey } }
            - name: NEURAWALL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "neurawall.secretName" . }}, key: databaseUrl, optional: true } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "neurawall.secretName" . }}, key: anthropicApiKey, optional: true } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, initialDelaySeconds: 20 }
          resources: {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim: { claimName: {{ include "neurawall.fullname" . }}-data }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neurawall.fullname" . }}
  labels: {{- include "neurawall.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports: [{ name: http, port: 80, targetPort: http }]
