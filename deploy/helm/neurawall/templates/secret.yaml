{{- if not .Values.controlPlane.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurawall.secretName" . }}
  labels: {{- include "neurawall.labels" . | nindent 4 }}
type: Opaque
stringData:
  secretKey: {{ .Values.controlPlane.secretKey | default (randAlphaNum 48) | quote }}
  databaseUrl: {{ .Values.controlPlane.databaseUrl | quote }}
  anthropicApiKey: {{ .Values.controlPlane.anthropicApiKey | quote }}
{{- end }}
