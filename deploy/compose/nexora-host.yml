# NeuraWall on the shared NEXORA/Vigilo host (92.5.69.99), behind the shared edge Caddy.
#
# Deploy ONLY via the host's locking script (never `docker compose up` directly there):
#   /opt/nexora/infrastructure/deployment/deploy.sh neurawall control-plane
#
# No ports are published: the edge Caddy (edge-caddy-1) joins the `neurawall_default`
# network and proxies neurawall.onenexora.com -> neurawall-control-plane-1:8080.
# Secrets live in /opt/neurawall/.env (mode 0600), see .env.example next to this file.
name: neurawall

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neurawall
      POSTGRES_USER: neurawall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/neurawall/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurawall -d neurawall"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  control-plane:
    build:
      context: ../..
    image: neurawall:host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEURAWALL_ENVIRONMENT: production
      NEURAWALL_DATABASE_URL: postgresql+psycopg://neurawall:${POSTGRES_PASSWORD}@postgres:5432/neurawall
      NEURAWALL_PUBLIC_URL: https://${NEURAWALL_DOMAIN:?set NEURAWALL_DOMAIN}
      NEURAWALL_AUTH__SECRET_KEY: ${NEURAWALL_SECRET_KEY:?set NEURAWALL_SECRET_KEY}
      NEURAWALL_AUTH__BOOTSTRAP_ADMIN_EMAIL: ${NEURAWALL_ADMIN_EMAIL:-admin@neurawall.local}
      NEURAWALL_POLICY__REQUIRE_FOUR_EYES: ${NEURAWALL_REQUIRE_FOUR_EYES:-false}
      NEURAWALL_DEMO_MODE: ${NEURAWALL_DEMO_MODE:-false}
      NEURAWALL_BILLING__PLAN: ${NEURAWALL_BILLING__PLAN:-community}
      NEURAWALL_BILLING__STRIPE_SECRET_KEY: ${NEURAWALL_BILLING__STRIPE_SECRET_KEY:-}
      NEURAWALL_BILLING__STRIPE_WEBHOOK_SECRET: ${NEURAWALL_BILLING__STRIPE_WEBHOOK_SECRET:-}
      NEURAWALL_BILLING__STRIPE_PORTAL_CONFIGURATION_ID: ${NEURAWALL_BILLING__STRIPE_PORTAL_CONFIGURATION_ID:-}
      NEURAWALL_BILLING__PRICE_PRO_MONTH: ${NEURAWALL_BILLING__PRICE_PRO_MONTH:-}
      NEURAWALL_BILLING__PRICE_PRO_YEAR: ${NEURAWALL_BILLING__PRICE_PRO_YEAR:-}
      NEURAWALL_BILLING__PRICE_BUSINESS_MONTH: ${NEURAWALL_BILLING__PRICE_BUSINESS_MONTH:-}
      NEURAWALL_BILLING__PRICE_BUSINESS_YEAR: ${NEURAWALL_BILLING__PRICE_BUSINESS_YEAR:-}
      NEURAWALL_BILLING__PRICE_ENTERPRISE_MONTH: ${NEURAWALL_BILLING__PRICE_ENTERPRISE_MONTH:-}
      NEURAWALL_BILLING__PRICE_ENTERPRISE_YEAR: ${NEURAWALL_BILLING__PRICE_ENTERPRISE_YEAR:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      NEURAWALL_LLM__MAX_CALLS_PER_HOUR: ${NEURAWALL_LLM__MAX_CALLS_PER_HOUR:-120}
      FORWARDED_ALLOW_IPS: "*"   # only reachable through the edge Caddy on this network
    volumes:
      - cpdata:/data            # bundle-signing key: back it up
    mem_limit: 2g

  # --- Optional watch-only node for the NEXORA host itself (profile "node"):
  #   deploy.sh neurawall zeek agent
  zeek:
    profiles: ["node"]
    image: zeek/zeek:lts
    restart: unless-stopped
    network_mode: host          # sees the host's real interface
    cap_add: [NET_RAW, NET_ADMIN]
    working_dir: /logs
    command: ["zeek", "-C", "-i", "${NEURAWALL_NODE_IFACE:-enp0s6}", "local", "/etc/nexora-node.zeek"]
    volumes:
      - zeeklogs:/logs
      - ./nexora-node.zeek:/etc/nexora-node.zeek:ro
    mem_limit: 1g

  agent:
    profiles: ["node"]
    image: neurawall:host        # built by the control-plane service
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        test -f /var/lib/neurawall-agent/agent-state.json ||
        neurawall agent enroll --config /etc/neurawall/agent.yaml --token "$$NEURAWALL_ENROLLMENT_TOKEN";
        exec neurawall agent run --config /etc/neurawall/agent.yaml
    environment:
      NEURAWALL_ENROLLMENT_TOKEN: ${NEURAWALL_NODE_ENROLLMENT_TOKEN:-}
    volumes:
      - zeeklogs:/zeek:ro
      - agentstate:/var/lib/neurawall-agent
      - ./nexora-node-agent.yaml:/etc/neurawall/agent.yaml:ro
    mem_limit: 512m

volumes:
  pgdata:
  cpdata:
  zeeklogs:
  agentstate:
