name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, layers, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check neurawall tests
      - name: Format
        run: uv run ruff format --check neurawall tests
      - name: Types
        run: uv run mypy neurawall
      - name: Layer boundaries (blueprint §3.1)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov=neurawall --cov-report=term --cov-fail-under=80

  postgres:
    name: Integration — PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neurawall
          POSTGRES_PASSWORD: neurawall
          POSTGRES_DB: neurawall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neurawall" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen --extra postgres
      - run: uv run pytest tests/integration -k "postgres"
        env:
          NEURAWALL_TEST_DATABASE_URL: postgresql+psycopg://neurawall:neurawall@localhost:5432/neurawall

  console:
    name: Console — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  security:
    name: Security — dependency audit & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Python dependency audit
        run: uv export --frozen --no-dev --extra postgres --no-hashes --no-emit-project > requirements.txt && uvx pip-audit -r requirements.txt --strict
      - name: SAST (ruff security rules)
        run: uvx ruff check --select S neurawall
      - name: npm audit
        working-directory: console
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high

  image:
    name: Container image & Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: neurawall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run -d --name nw -p 8080:8080 \
            -e NEURAWALL_AUTH__SECRET_KEY=ci-secret-key-ci-secret-key-ci-secret-key \
            neurawall:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 2; done
          curl -sf localhost:8080/readyz
          curl -sf localhost:8080/ | grep -q "NeuraWall Console"
          docker logs nw | tail -20
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/neurawall && helm template t deploy/helm/neurawall --set agent.enabled=true > /dev/null
